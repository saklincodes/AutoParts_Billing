<div class="flex flex-col gap-sm sticky top-0 z-10 bg-surface/95 backdrop-blur-sm pb-sm">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">

<input id="productSearch" class="w-full h-12 pl-12 pr-4 bg-surface-container-low text-on-surface rounded-xl focus:outline-none focus:bg-surface-container-high transition-colors font-body-md" placeholder="Search spare parts, brands, or SKU..." type="text"/>

<div class="flex gap-sm overflow-x-auto pb-2 no-scrollbar">

<span class="font-label-lg text-label-lg">Engine</span>
</button>
<button class="flex items-center gap-xs px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full shrink-0 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">tire_repair</span>

<button class="flex items-center gap-xs px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full shrink-0 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">lightbulb</span>

</div>
<!-- Inventory Stats (Subtle Context) -->
<div class="flex gap-md mb-2">
<div class="flex-1 bg-surface-container rounded-xl p-3 flex flex-col gap-1">
<span class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider">Total Items</span>
<span class="text-on-surface font-headline-sm text-headline-sm">1,284</span>
</div>
<div class="flex-1 bg-tertiary-fixed rounded-xl p-3 flex flex-col gap-1">
<span class="text-on-tertiary-fixed-variant font-label-md text-label-md uppercase tracking-wider">Low Stock</span>
<span class="text-on-tertiary-fixed font-headline-sm text-headline-sm">12 Items</span>
</div>

<span class="material-symbols-outlined text-[28px]">add</span>
</a>
<a class="w-14 h-14 bg-secondary-container text-on-secondary-container rounded-2xl shadow-xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all" href="../stock_adjustment/code.html">
<span class="material-symbols-outlined text-[28px]">swap_vert</span>
</a>

  <script>
    let allProducts = [];
    let currentFilter = '';

    async function loadProducts(filter) {
      filter = filter || '';
      try {
        allProducts = await AppDB.searchProducts();
        if (filter) allProducts = allProducts.filter(function(p) { return p.category === filter.toLowerCase(); });
        renderProducts(allProducts);
        updateStats();
      } catch (e) { console.warn('AppDB error', e); }
    }

    async function updateStats() {
      try {
        var products = await AppDB.getProducts();
        var total = products.length;
        var lowStock = products.filter(function(p) { return p.stock_qty <= p.low_stock_qty; }).length;
        document.querySelectorAll('.bg-surface-container .font-headline-sm')[0].textContent = total;
        document.querySelectorAll('.bg-tertiary-fixed .font-headline-sm')[0].textContent = lowStock + ' Items';
      } catch (e) {}
    }

    function renderProducts(products) {
      const container = document.getElementById('productContainer');
      if (!container) return;
      if (!products || products.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 px-margin-mobile text-center gap-sm opacity-60">
            <span class="material-symbols-outlined text-[48px] text-outline">inventory_2</span>
            <p class="font-body-md text-body-md text-on-surface-variant">No products found.<br/>Click + to add a new product.</p>
          </div>
        `;
        return;
      }
      container.innerHTML = products.map(p => {
        const isLow = p.stock_qty <= p.low_stock_qty;
        return `
          <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden group active:scale-[0.98] transition-transform">
            <div class="flex h-32">
              <div class="w-32 h-full relative shrink-0 bg-surface-container-highest flex items-center justify-center">
                <span class="material-symbols-outlined text-[40px] text-outline">inventory_2</span>
                ${isLow ? '<div class="absolute top-2 left-2 px-2 py-1 bg-tertiary text-on-tertiary rounded font-label-md text-[10px] uppercase font-bold">Low Stock</div>' : ''}
              </div>
              <div class="flex-1 p-3 flex flex-col justify-between min-w-0">
                <div class="flex justify-between items-start">
                  <div class="min-w-0">
                    <h3 class="text-on-surface font-title-lg text-title-lg truncate">${p.name}</h3>
                    <p class="text-on-surface-variant font-body-md text-body-md line-clamp-1">${p.brand || ''} - SKU: ${p.sku}</p>
                  </div>
                  <div class="flex gap-1">
                    <button class="p-1.5 text-on-surface-variant hover:bg-surface-container rounded-lg" onclick="event.stopPropagation();window.location.href='../add_edit_product/code.html?id='+${p.id}">
                      <span class="material-symbols-outlined text-[20px]">edit</span>
                    </button>
                  </div>
                </div>
                <div class="flex items-end justify-between">
                  <div class="flex flex-col">
                    <span class="text-primary font-headline-sm text-headline-sm">₹${Number(p.price).toLocaleString()}</span>
                    <span class="text-on-surface-variant font-label-md text-label-md">Qty: <span class="${isLow ? 'text-tertiary font-bold' : 'font-bold'}">${p.stock_qty} units</span></span>
                  </div>
                  <button class="p-1.5 text-error" onclick="event.stopPropagation();deleteProduct(${p.id},'${p.name.replace(/'/g, "\\'")}')">
                    <span class="material-symbols-outlined text-[20px]">delete</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function deleteProduct(id, name) {
      if (confirm('Delete "' + name + '"? This cannot be undone.')) {
        AppDB.deleteProduct(id).then(function() {
          loadProducts();
        }).catch(function(e) { alert('Delete failed: ' + e.message); });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();

      // Search functionality
      const searchInput = document.getElementById('productSearch');
      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          const q = searchInput.value.toLowerCase();
          const filtered = allProducts.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.sku.toLowerCase().includes(q) ||
            (p.brand && p.brand.toLowerCase().includes(q))
          );
          renderProducts(filtered);
        }, 200);
      });

      // Category filter
      const filters = document.querySelectorAll('button[class*="rounded-full"]');
      filters.forEach(btn => {
        btn.addEventListener('click', () => {
          filters.forEach(b => {
            b.classList.remove('bg-primary', 'text-on-primary');
            b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
          });
          btn.classList.add('bg-primary', 'text-on-primary');
          btn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');

          const cat = btn.querySelector('span:last-child').textContent.trim();
          currentFilter = cat === 'All Categories' ? '' : cat;
          loadProducts(currentFilter);
        });
      });

      // FAB animation
      const fab = document.getElementById('fab-group');
      fab.animate([
        { transform: 'scale(1)', boxShadow: '0 10px 25px -5px rgba(0, 6, 102, 0.4)' },
        { transform: 'scale(1.1)', boxShadow: '0 15px 30px -5px rgba(0, 6, 102, 0.6)' },
        { transform: 'scale(1)', boxShadow: '0 10px 25px -5px rgba(0, 6, 102, 0.4)' }
      ], { duration: 1000, iterations: 2, easing: 'ease-in-out' });
    });
  </script>
