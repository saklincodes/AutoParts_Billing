<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">
<main class="flex-1 relative w-full bg-surface flex flex-col items-center justify-center min-h-screen px-margin-mobile">
  <div class="relative z-10 flex flex-col items-center justify-center text-center my-auto" id="logo-wrapper">
    <div class="relative w-36 h-36 mb-lg mx-auto">
      <div class="absolute inset-0 rounded-full bg-primary/10 animate-ping"></div>
      <svg class="relative w-full h-full drop-shadow-xl" viewbox="0 0 128 128"><circle cx="64" cy="64" r="60" fill="currentColor" class="text-primary"/><text x="64" y="82" text-anchor="middle" fill="currentColor" class="text-surface" font-size="44" font-weight="800" font-family="sans-serif">PA</text></svg>
    </div>
    <div class="space-y-xs">
      <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight uppercase">
        Putul Auto Parts
      </h1>
      <div class="flex items-center justify-center gap-sm">
        <div class="h-[1px] w-8 bg-outline-variant"></div>
        <span class="font-label-lg text-label-lg text-secondary tracking-widest uppercase">
          &amp; Autoscan
        </span>
        <div class="h-[1px] w-8 bg-outline-variant"></div>
      </div>
    </div>
  </div>
  <div class="w-full max-w-[220px] mb-12 flex flex-col items-center gap-md">
    <div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
      <div class="h-full bg-primary w-0 transition-all duration-[500ms] ease-in-out" id="progress-bar"></div>
    </div>
    <p class="font-label-md text-label-md text-on-surface-variant/60 animate-pulse" id="loading-text">
      Initializing POS Environment...
    </p>
  </div>
</main>
<script>
  (function() {
    var navStarted = false;

    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.SplashScreen) {
      try { Capacitor.Plugins.SplashScreen.hide(); } catch(e) {}
    }

    function navigateToDashboard() {
      if (navStarted) return;
      navStarted = true;
      var overlay = document.querySelector('.page-exit-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'page-exit-overlay';
        document.body.appendChild(overlay);
      }
      overlay.classList.add('active');
      setTimeout(function() {
        window.location.replace('dashboard/code.html');
      }, 150);
    }

    setTimeout(function() {
      var progressBar = document.getElementById('progress-bar');
      if (progressBar) progressBar.style.width = '100%';
    }, 50);

    // Fail-safe redirect timer (max 600ms)
    setTimeout(navigateToDashboard, 600);

    try {
      if (typeof AppDB !== 'undefined' && AppDB.init) {
        AppDB.init().then(function() {
          navigateToDashboard();
        }).catch(function() {
          navigateToDashboard();
        });
      }
    } catch(e) {
      navigateToDashboard();
    }
  })();
</script>
</body>
</html>
