  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-4 flex items-center gap-sm"><button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex-1 flex items-center gap-sm overflow-hidden"><img alt="Logo" class="h-6 w-auto shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCB-vfM_j8m0mnYqv-qrArJJYEZNCL75-aiphhaJQcoQVPoC3A76ANpHOPkyRLHYpekHZBe_YIcReDkTz21Qo27OWejspTfOy-OHBzifZoE8ZurJBpVWdgdm88C8pQB1JL3p7D-fCJFUAWcjR1Quvl2pK-MLA5cS1I4SVY9z1idflECdBvq_0vFDdkKAgQNDvUlSWumftxN0UTTSsPHXrPahAHCvSDX_Y343vXIR0Z-uCQUP_psnDU0JiHQBDnvyGhUjAAiv51tzQE"/><h1 class="font-title-lg text-title-lg text-on-surface truncate" id="pageTitle">Add Product</h1></div></div></header><main class="flex-1 relative w-full pt-16 pt-safe bg-surface px-margin-mobile pb-safe"><div class="flex flex-col w-full pb-10">
<!-- Status & Header Decorative Element -->
<div class="relative w-full overflow-hidden rounded-xl bg-primary-container p-6 mb-6">
<div class="relative z-10 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-on-primary-fixed-variant flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined text-headline-sm">inventory_2</span>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-primary-fixed">Product Details</h2>
<p class="font-body-md text-body-md text-on-primary-fixed/80">Keep your inventory accurate and up-to-date.</p>
</div>
</div>
<!-- Decorative background blobs -->
<div class="absolute top-[-20%] right-[-10%] w-40 h-40 bg-on-primary-fixed/10 rounded-full blur-2xl"></div>
<div class="absolute bottom-[-50%] left-[20%] w-32 h-32 bg-primary/20 rounded-full blur-xl animate-pulse"></div>
</div>
<form class="space-y-6" id="productForm">
<!-- Image Upload Section -->
<div class="flex flex-col gap-sm">
<span class="font-label-lg text-label-lg text-on-surface-variant ml-1">Product Media</span>
<div class="relative group cursor-pointer h-48 rounded-xl bg-surface-container-high flex flex-items-center justify-center overflow-hidden transition-all active:scale-[0.98]" id="imageUploadZone">
<input accept="image/*" class="hidden" id="fileInput" type="file"/>
<!-- Empty State -->
<div class="flex flex-col items-center gap-2" id="uploadPlaceholder">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant text-center px-6">Tap to upload or take a photo of the item</p>
</div>
<!-- Preview State (Hidden by default) -->
<div class="hidden absolute inset-0 w-full h-full" id="imagePreviewContainer">
<img class="w-full h-full object-cover" data-alt="A professional product shot of a high-quality automotive performance part, like a polished chrome turbocharger or a carbon fiber engine cover, set against a clean studio background with soft cinematic lighting. The image emphasizes precision engineering and durability with subtle blue and grey highlights matching the app's palette." id="imagePreview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApwJTrUtErNjVzcrdAPgY-eyiRb2KTGkZTAckEYH6nXDtFeEzpbHDwt1HidxpTVi8GC9dMGXlV_fS3WwOjBc05PrBzk7LbTtw65UpB5UJWOiVSYcPOlnLqp5svmypjE7WbPI1RxtJu-xjWBKoyQATVHWTs0gmxKs51rACJaaPaezcf1Kd7xF5NYXiyswvILqYmrXjS0Rg_ElTrd-uN7Kolao1kjarzD7-Jg6M1WdLQDyhtt4yPNLM3HXA_USqOS3KaJSPd8qvBzWU"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">edit</span>
</div>
</div>
<!-- Compressing Overlay -->
<div class="hidden absolute inset-0 bg-surface-container-highest/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3" id="compressingOverlay">
<div class="relative w-10 h-10">
<svg class="animate-spin w-full h-full text-primary" viewbox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" fill="none" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<span class="font-label-lg text-label-lg text-primary animate-pulse">Compressing...</span>
</div>
</div>
</div>
<!-- Main Info Card -->
<div class="bg-surface-container-low rounded-xl p-4 space-y-4">
<!-- Product Name -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pName">Product Name</label>
<input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pName" placeholder="e.g. Premium Synthetic Oil 5W-30" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Category -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pCategory">Category</label>
<select class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all appearance-none" id="pCategory">
<option value="">Select...</option>
<option value="fluids">Fluids &amp; Oils</option>
<option value="parts">Engine Parts</option>
<option value="tires">Tires &amp; Wheels</option>
<option value="tools">Shop Tools</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<!-- SKU -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pSKU">Part Number / SKU</label>
<input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pSKU" placeholder="SKU-8820" type="text"/>
</div>
</div>
</div>
<!-- Inventory & Pricing Card -->
<div class="bg-surface-container-low rounded-xl p-4 space-y-4">
<!-- Price -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pPrice">Unit Price</label>
<div class="relative">
<span class="absolute left-4 top-4 text-on-surface-variant font-body-lg text-body-lg">$</span>
<input class="w-full h-14 bg-transparent border-b-2 border-outline-variant pl-8 pr-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pPrice" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Stock Quantity -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pStock">Current Stock</label>
<input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pStock" placeholder="0" type="number"/>
</div>
<!-- Threshold -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pThreshold">Low Stock Alert</label>
<input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pThreshold" placeholder="5" type="number"/>
</div>
</div>
<!-- Warning State Example (Dynamic) -->
<div class="hidden items-center gap-2 text-error px-2" id="stockWarning">
<span class="material-symbols-outlined text-[18px]">warning</span>
<span class="font-label-md text-label-md">Stock is below threshold.</span>
</div>
</div>
<!-- Description -->
<div class="bg-surface-container-low rounded-xl p-4">
<div class="relative group">
<label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pDesc">Product Description</label>
<textarea class="w-full bg-transparent border-b-2 border-outline-variant px-4 pt-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30 resize-none" id="pDesc" placeholder="Enter technical specifications or usage instructions..." rows="3"></textarea>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 pt-4">
<button class="w-full h-12 bg-primary text-on-primary rounded-full font-label-lg text-label-lg shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2" id="saveBtn" type="submit">
<span class="material-symbols-outlined">save</span>
        Save Product
      </button>
<button class="w-full h-12 bg-surface text-secondary font-label-lg text-label-lg rounded-full active:bg-surface-container-high transition-colors" onclick="history.back()" type="button">
        Cancel
      </button>
</div>
</form>
</div>
<script>
  var editId = null;
  var params = new URLSearchParams(window.location.search);
  if (params.get('id')) { editId = params.get('id'); }

  var zone = document.getElementById('imageUploadZone');
  var fileInput = document.getElementById('fileInput');
  var overlay = document.getElementById('compressingOverlay');
  var placeholder = document.getElementById('uploadPlaceholder');
  var previewContainer = document.getElementById('imagePreviewContainer');
  var stockInput = document.getElementById('pStock');
  var thresholdInput = document.getElementById('pThreshold');
  var stockWarning = document.getElementById('stockWarning');

  if (editId) {
    document.getElementById('pageTitle').textContent = 'Edit Product';
    document.querySelector('.font-headline-sm').textContent = 'Edit Product Details';
    document.getElementById('saveBtn').innerHTML = '<span class="material-symbols-outlined">save</span> Update Product';
    AppDB.getProduct(editId).then(function(p) {
      if (!p) return;
      document.getElementById('pName').value = p.name || '';
      document.getElementById('pSKU').value = p.sku || '';
      document.getElementById('pCategory').value = p.category || '';
      document.getElementById('pPrice').value = p.price || '';
      document.getElementById('pStock').value = p.stock_qty || '';
      document.getElementById('pThreshold').value = p.low_stock_qty || '';
      document.getElementById('pDesc').value = p.description || '';
      checkStock();
    });
  }

  zone.addEventListener('click', function() { fileInput.click(); });

  fileInput.addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      setTimeout(function() {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        placeholder.classList.add('hidden');
        previewContainer.classList.remove('hidden');
      }, 1500);
    }
  });

  function checkStock() {
    var stock = parseInt(stockInput.value) || 0;
    var threshold = parseInt(thresholdInput.value) || 0;
    if (stock <= threshold && stockInput.value !== '') {
      stockWarning.classList.remove('hidden');
      stockWarning.classList.add('flex');
      stockInput.classList.replace('border-outline-variant', 'border-error');
    } else {
      stockWarning.classList.add('hidden');
      stockInput.classList.replace('border-error', 'border-outline-variant');
    }
  }

  stockInput.addEventListener('input', checkStock);
  thresholdInput.addEventListener('input', checkStock);

  document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('saveBtn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saving...';
    btn.classList.add('opacity-80', 'pointer-events-none');
    var product = {
      name: document.getElementById('pName').value,
      sku: document.getElementById('pSKU').value,
      category: document.getElementById('pCategory').value,
      price: parseFloat(document.getElementById('pPrice').value) || 0,
      stock_qty: parseInt(document.getElementById('pStock').value) || 0,
      low_stock_qty: parseInt(document.getElementById('pThreshold').value) || 5,
      description: document.getElementById('pDesc').value
    };
    if (editId) product.id = Number(editId);
    AppDB.saveProduct(product).then(function() {
      btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
      btn.classList.replace('bg-primary', 'bg-emerald-600');
      setTimeout(function() { history.back(); }, 800);
    }).catch(function() {
      btn.innerHTML = '<span class="material-symbols-outlined">error</span> Error';
      btn.classList.remove('opacity-80', 'pointer-events-none');
    });
  });
</script></main></body></html>
