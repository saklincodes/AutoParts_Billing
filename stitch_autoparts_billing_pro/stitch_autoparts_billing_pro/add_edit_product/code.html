iner":"#8690ee","primary-fixed":"#e0e0ff","surface-container-low":"#f3f4f5","on-secondary-fixed-variant":"#354a53","on-tertiary":"#ffffff","primary-fixed-dim":"#bdc2ff","on-tertiary-container":"#fa6d00"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin-desktop":"32px","gutter":"24px","xs":"4px","margin-mobile":"16px","base":"4px","lg":"24px","md":"16px","xl":"32px","sm":"8px"},"fontFamily":{"headline-md":["Inter"],"title-lg":["Inter"],"label-md":["Inter"],"body-lg":["Inter"],"headline-lg":["Inter"],"headline-lg-mobile":["Inter"],"label-lg":["Inter"],"headline-sm":["Inter"],"body-md":["Inter"]},"fontSize":{"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"title-lg":["18px",{"lineHeight":"24px","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"16px","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-lg-mobile":["28px",{"lineHeight":"36px","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.1px","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}]}}}}</script><style> body { } </style> </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] "><div class="h-16 px-margin-mobile flex items-center justify-between"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/5 active:scale-95 transition-transform" onclick="window.location.href='../inventory/code.html'"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button><span class="font-title-lg text-title-lg text-on-surface" id="pageTitle">Add Product</span><div class="w-10"></div></div></header><main class="flex-1 relative w-full bg-surface px-margin-mobile pt-16" ><div class="flex flex-col w-full max-w-md mx-auto gap-lg"> <!-- Hero Section / Context Header --> <div class="relative overflow-hidden bg-primary-fixed rounded-2xl p-6 shadow-sm"> <div class="relative z-10 flex items-center gap-4"> <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shrink-0"> <span class="material-symbols-outlined text-on-primary text-[28px]">add_box</span> </div> <div> <h2 class="font-headline-sm text-headline-sm text-on-primary-fixed">Product Details</h2> <p class="font-body-md text-body-md text-on-primary-fixed/80">Keep your inventory accurate and up-to-date.</p> </div> </div> </div> <form class="space-y-6" id="productForm"> <!-- Image Upload Section --> <div class="flex flex-col gap-sm"> <span class="font-label-lg text-label-lg text-on-surface-variant ml-1">Product Media</span> <div class="relative group cursor-pointer h-48 rounded-xl bg-surface-container-high flex flex-col items-center justify-center overflow-hidden transition-all active:scale-[0.98]" id="imageUploadZone"> <input accept="image/*" class="hidden" id="fileInput" type="file"/><input accept="image/*" capture="environment" class="hidden" id="cameraInput" type="file"/> <!-- Empty State --> <div class="flex flex-col items-center gap-2" id="uploadPlaceholder"> <div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant"> <span class="material-symbols-outlined">add_a_photo</span> </div> <p class="font-label-md text-label-md text-on-surface-variant text-center px-6">Tap to upload or take a photo of the item</p> <div class="flex gap-2 mt-2"> <button type="button" class="px-3 py-1.5 bg-primary text-on-primary text-xs rounded-full flex items-center gap-1 cursor-pointer" id="btnCamera"> <span class="material-symbols-outlined text-[16px] pointer-events-none">photo_camera</span> <span class="pointer-events-none">Camera</span> </button> <button type="button" class="px-3 py-1.5 bg-secondary-container text-on-secondary-container text-xs rounded-full flex items-center gap-1 cursor-pointer" id="btnGallery"> <span class="material-symbols-outlined text-[16px] pointer-events-none">image</span> <span class="pointer-events-none">Gallery</span> </button> </div> </div> <!-- Preview State (Hidden by default) --> <div class="hidden absolute inset-0 w-full h-full" id="imagePreviewContainer"> <img class="w-full h-full object-cover" id="imagePreview" src=""/> <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"> <span class="material-symbols-outlined text-white">edit</span> </div> </div> </div> </div> <!-- Main Info Card --> <div class="bg-surface-container-low rounded-xl p-4 space-y-4"> <!-- Product Name --> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pName">Product Name</label> <input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pName" placeholder="e.g. Premium Synthetic Oil 5W-30" required type="text"/> </div> <div class="grid grid-cols-2 gap-4"> <!-- Category --> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pCategory">Category</label> <select class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all appearance-none" id="pCategory"> <option value="general">General Parts</option> <option value="fluids">Fluids &amp; Oils</option> <option value="parts">Engine Parts</option> <option value="tires">Tires &amp; Wheels</option> <option value="tools">Shop Tools</option> </select> <span class="material-symbols-outlined absolute right-3 top-4 text-on-surface-variant pointer-events-none">expand_more</span> </div> <!-- SKU --> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pSKU">Part Number / SKU</label> <input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pSKU" placeholder="SKU-8820" type="text"/> </div> </div> </div> <!-- Inventory & Pricing Card --> <div class="bg-surface-container-low rounded-xl p-4 space-y-4"> <!-- Price --> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pPrice">Unit Price (₹)</label> <div class="relative"> <span class="absolute left-4 top-4 text-on-surface-variant font-body-lg text-body-lg font-bold">₹</span> <input class="w-full h-14 bg-transparent border-b-2 border-outline-variant pl-8 pr-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pPrice" placeholder="0.00" step="0.01" type="number"/> </div> </div> <div class="grid grid-cols-2 gap-4"> <!-- Stock Quantity --> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pStock">Current Stock</label> <input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pStock" placeholder="0" type="number"/> </div> <!-- Threshold --> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pThreshold">Low Stock Alert</label> <input class="w-full h-14 bg-transparent border-b-2 border-outline-variant px-4 pt-2 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30" id="pThreshold" placeholder="5" type="number"/> </div> </div> <!-- Warning State --> <div class="hidden items-center gap-2 text-error px-2" id="stockWarning"> <span class="material-symbols-outlined text-[18px]">warning</span> <span class="font-label-md text-label-md">Stock is below threshold.</span> </div> </div> <!-- Description --> <div class="bg-surface-container-low rounded-xl p-4"> <div class="relative group"> <label class="font-label-md text-label-md text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10 transition-colors group-focus-within:text-primary" for="pDesc">Product Description</label> <textarea class="w-full bg-transparent border-b-2 border-outline-variant px-4 pt-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-all placeholder:text-on-surface-variant/30 resize-none" id="pDesc" placeholder="Enter technical specifications..." rows="3"></textarea> </div> </div> <!-- Actions --> <div class="flex flex-col gap-3 pt-4"> <button class="w-full h-12 bg-primary text-on-primary rounded-full font-label-lg text-label-lg shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2" id="saveBtn" type="submit"> <span class="material-symbols-outlined">save</span> Save Product </button> <button class="w-full h-12 bg-surface text-secondary font-label-lg text-label-lg rounded-full active:bg-surface-container-high transition-colors" onclick="window.location.href='../inventory/code.html'" type="button"> Cancel </button> </div> Form </form> </div> <script> var editId = null; var currentProductImage = ''; var params = new URLSearchParams(window.location.search); if (params.get('id')) { editId = params.get('id'); } var fileInput = document.getElementById('fileInput'); var cameraInput = document.getElementById('cameraInput'); var placeholder = document.getElementById('uploadPlaceholder'); var previewContainer = document.getElementById('imagePreviewContainer'); var previewImg = document.getElementById('imagePreview'); var stockInput = document.getElementById('pStock'); var thresholdInput = document.getElementById('pThreshold'); var stockWarning = document.getElementById('stockWarning'); if (editId) { document.getElementById('pageTitle').textContent = 'Edit Product'; document.querySelector('.font-headline-sm').textContent = 'Edit Product Details'; document.getElementById('saveBtn').innerHTML = '<span class="material-symbols-outlined">save</span> Update Product'; AppDB.getProduct(editId).then(function(p) { if (!p) return; document.getElementById('pName').value = p.name || ''; document.getElementById('pSKU').value = p.sku || ''; document.getElementById('pCategory').value = p.category || 'general'; document.getElementById('pPrice').value = p.price || ''; document.getElementById('pStock').value = p.stock_qty || ''; document.getElementById('pThreshold').value = p.low_stock_qty || ''; document.getElementById('pDesc').value = p.description || ''; if (p.image) { currentProductImage = p.image; previewImg.src = p.image; placeholder.classList.add('hidden'); previewContainer.classList.remove('hidden'); } checkStock(); }); } function compressBase64Image(base64Str, maxWidth, callback) { if (!base64Str || base64Str.length < 100000) { callback(base64Str); return; } var img = new Image(); img.src = base64Str; img.onload = function() { var canvas = document.createElement('canvas'); var scale = maxWidth / img.width; if (scale >= 1) { callback(base64Str); return; } canvas.width = maxWidth; canvas.height = img.height * scale; var ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); callback(canvas.toDataURL('image/jpeg', 0.7)); }; img.onerror = function() { callback(''); }; } function takePhoto(sourceType) { if (sourceType === 'camera') { var camIn = document.getElementById('cameraInput'); if (camIn) { camIn.value = ''; camIn.click(); } } else { var fileIn = document.getElementById('fileInput'); if (fileIn) { fileIn.value = ''; fileIn.click(); } } } document.getElementById('btnCamera').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); takePhoto('camera'); }); document.getElementById('btnGallery').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); takePhoto('photos'); }); document.getElementById('imageUploadZone').addEventListener('click', function(e) { if (e.target.closest('#btnCamera') || e.target.closest('#btnGallery')) return; var fileIn = document.getElementById('fileInput'); if (fileIn) fileIn.click(); }); function handleFileSelect(e) { var file = e.target.files && e.target.files[0]; if (file) { var reader = new FileReader(); reader.onload = function(ev) { currentProductImage = ev.target.result; previewImg.src = currentProductImage; placeholder.classList.add('hidden'); previewContainer.classList.remove('hidden'); }; reader.readAsDataURL(file); } } fileInput.addEventListener('change', handleFileSelect); cameraInput.addEventListener('change', handleFileSelect); function checkStock() { var stock = parseInt(stockInput.value) || 0; var threshold = parseInt(thresholdInput.value) || 0; if (stock <= threshold && stockInput.value !== '') { stockWarning.classList.remove('hidden'); stockWarning.classList.add('flex'); stockInput.classList.replace('border-outline-variant', 'border-error'); } else { stockWarning.classList.add('hidden'); stockInput.classList.replace('border-error', 'border-outline-variant'); } } stockInput.addEventListener('input', checkStock); thresholdInput.addEventListener('input', checkStock); document.getElementById('productForm').addEventListener('submit', function(e) { e.preventDefault(); var btn = document.getElementById('saveBtn'); btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saving...'; btn.classList.add('opacity-80', 'pointer-events-none'); compressBase64Image(currentProductImage, 500, function(compressedImg) { var product = { name: document.getElementById('pName').value, sku: document.getElementById('pSKU').value || ('SKU-' + Math.floor(Math.random() * 8999 + 1000)), category: document.getElementById('pCategory').value || 'general', price: parseFloat(document.getElementById('pPrice').value) || 0, stock_qty: parseInt(document.getElementById('pStock').value) || 0, low_stock_qty: parseInt(document.getElementById('pThreshold').value) || 5, description: document.getElementById('pDesc').value, image: compressedImg || '' }; if (editId) product.id = Number(editId); AppDB.saveProduct(product).then(function() { btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success'; btn.classList.replace('bg-primary', 'bg-emerald-600'); setTimeout(function() { window.location.href = '../inventory/code.html'; }, 400); }).catch(function(err) { alert('Error saving product: ' + (err ? err.message : 'Unknown error')); btn.innerHTML = '<span class="material-symbols-outlined">error</span> Error'; btn.classList.remove('opacity-80', 'pointer-events-none'); }); }); }); </script><div id="bottom-nav-spacer" class="h-32 w-full shrink-0"></div></main></body></html>
