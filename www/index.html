<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="/static/offline-fonts.css" rel="stylesheet" onerror="this.onerror=null;this.href='../offline-fonts.css';"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Putul Auto Parts &amp; Autoscan</title>
  
  <script src="https://cdn.tailwindcss.com" onerror="var s=document.createElement('script');s.src='/static/tailwind.min.js';document.head.appendChild(s);"></script><script src="../js/app-db.js" onerror="this.onerror=null;this.src='/static/js/app-db.js'"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#000666",
            surface: "#f8f9fa"
          }
        }
      }
    };
  </script>
  <style>html, body { overflow-y: auto !important; min-height: 100vh; } 
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-surface">
  <main class="flex flex-col items-center justify-center p-6 text-center w-full max-w-sm mx-auto">
    <div class="relative w-36 h-36 mb-6">
      <div class="absolute inset-0 rounded-full bg-primary/10 animate-ping"></div>
      <img src="/static/logo.png" onerror="this.onerror=null;this.src='../logo.png'" alt="Putul Auto Logo" class="relative w-full h-full object-contain drop-shadow-xl"/>
    </div>
    <h1 class="text-xl font-bold text-slate-900 uppercase tracking-tight mb-1">
      Putul Auto Parts
    </h1>
    <p class="text-xs font-semibold text-slate-500 tracking-widest uppercase mb-6">
      &amp; Autoscan
    </p>
    
    <div class="w-48 h-1.5 bg-slate-200 rounded-full overflow-hidden mb-3">
      <div id="progress-bar" class="h-full bg-indigo-900 w-0 transition-all duration-300 ease-out"></div>
    </div>
    <p class="text-xs text-slate-400 animate-pulse" id="loading-text">Starting system...</p>
  <div id="bottom-nav-spacer" class="h-32 w-full shrink-0"></div></main>

  <script>
    (function() {
      var redirected = false;

      function hideNativeSplash() {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
          try {
            window.Capacitor.Plugins.SplashScreen.hide();
          } catch(e) {}
        }
      }

      function goToDashboard() {
        if (redirected) return;
        redirected = true;
        hideNativeSplash();
        window.location.replace('./dashboard/code.html');
      }

      // Hide splash screen immediately on load
      hideNativeSplash();
      document.addEventListener('deviceready', hideNativeSplash, false);
      document.addEventListener('DOMContentLoaded', hideNativeSplash, false);

      var pBar = document.getElementById('progress-bar');
      if (pBar) pBar.style.width = '100%';

      // Initialize DB & redirect quickly (max 300ms)
      try {
        if (typeof AppDB !== 'undefined' && AppDB.init) {
          AppDB.init().then(function() {
            setTimeout(goToDashboard, 200);
          }).catch(function() {
            setTimeout(goToDashboard, 200);
          });
        } else {
          setTimeout(goToDashboard, 200);
        }
      } catch(e) {
        setTimeout(goToDashboard, 200);
      }

      // Fail-safe timeout at 400ms
      setTimeout(goToDashboard, 400);
    })();
  </script>
</body>
</html>
