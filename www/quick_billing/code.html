<!-- Floating Feedback Toast Area (for the scripts) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none z-[60]" id="toast-container"></div>
    <script>
        const searchInput = document.getElementById('quickSearch');
        const recentPartsContainer = document.getElementById('quickProductsList');
        let allProducts = [];

        async function loadProducts() {
            try {
                allProducts = await AppDB.searchProductsMin();
                renderRecentParts();
            } catch (e) { console.warn('AppDB error', e); }
        }

        function renderRecentParts() {
            if (!recentPartsContainer || allProducts.length === 0) return;
            const items = allProducts.slice(0, 5).map(function(p) {
                return '<div class="p-md bg-surface-container-lowest rounded-xl flex items-center gap-md shadow-sm active:bg-surface-container transition-colors cursor-pointer group" onclick="quickAdd(' + p.id + ',\'' + p.name.replace(/'/g, "\\'") + '\',' + p.price + ')"><div class="w-12 h-12 rounded-lg bg-background flex items-center justify-center"><span class="material-symbols-outlined text-outline text-[28px]">inventory_2</span></div><div class="flex-1 min-w-0"><div class="flex justify-between items-start"><p class="font-label-lg text-label-lg text-on-background truncate">' + p.name + '</p><span class="font-label-md text-label-md text-primary">\u20b9' + Number(p.price).toFixed(2) + '</span></div><p class="font-label-md text-label-md text-on-surface-variant truncate">SKU: ' + p.sku + ' \u2022 ' + p.stock_qty + ' in stock</p></div><span class="material-symbols-outlined text-primary">add_circle</span></div>';
            }).join('');
            recentPartsContainer.innerHTML = items;
        }

        if (searchInput) {
            searchInput.addEventListener('input', function() {
                var q = this.value.toLowerCase().trim();
                if (q.length < 1) { renderRecentParts(); return; }
                var matches = allProducts.filter(function(p) { return p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q); }).slice(0, 5);
                if (matches.length === 0) { recentPartsContainer.innerHTML = '<div class="text-center py-8 text-on-surface-variant">No results found</div>'; return; }
                recentPartsContainer.innerHTML = matches.map(function(p) {
                    return '<div class="p-md bg-surface-container-lowest rounded-xl flex items-center gap-md shadow-sm active:bg-surface-container transition-colors cursor-pointer group" onclick="quickAdd(' + p.id + ',\'' + p.name.replace(/'/g, "\\'") + '\',' + p.price + ')"><div class="w-12 h-12 rounded-lg bg-background flex items-center justify-center"><span class="material-symbols-outlined text-outline text-[28px]">inventory_2</span></div><div class="flex-1 min-w-0"><div class="flex justify-between items-start"><p class="font-label-lg text-label-lg text-on-background truncate">' + p.name + '</p><span class="font-label-md text-label-md text-primary">\u20b9' + Number(p.price).toFixed(2) + '</span></div><p class="font-label-md text-label-md text-on-surface-variant truncate">SKU: ' + p.sku + ' \u2022 ' + p.stock_qty + ' in stock</p></div><span class="material-symbols-outlined text-primary">add_circle</span></div>';
                }).join('');
            });
        }

        var quickCart = [];
        function quickAdd(pid, name, price) {
            var existing = quickCart.find(function(i) { return i.pid === pid; });
            if (existing) { existing.qty++; }
            else { quickCart.push({pid: pid, name: name, price: price, qty: 1}); }
            showToast('Added: ' + name);
        }

        loadProducts();

        document.getElementById('reprint-btn').addEventListener('click', function() { showToast('Creating invoice...'); createQuickInvoice(); });
        document.getElementById('draft-btn').addEventListener('click', function() { showToast('Work order saved to drafts'); });

        async function createQuickInvoice() {
            if (quickCart.length === 0) { showToast('Cart is empty!'); return; }
            var items = quickCart.map(function(i) { return { product_id: i.pid, quantity: i.qty, unit_price: i.price }; });
            try {
                var result = await AppDB.createInvoice({ items: items, discount: 0, tax: 0 });
                if (result) {
                    showToast('Invoice ' + result.invoice_no + ' created!');
                    quickCart = [];
                    setTimeout(function() { window.location.href = '../invoice_preview_1/code.html?id=' + result.id; }, 1000);
                } else { showToast('Error creating invoice'); }
            } catch (e) { showToast('Error: ' + e.message); }
        }

        var scrollContainer = document.querySelector('.overflow-x-auto');
        if (scrollContainer) {
            scrollContainer.addEventListener('wheel', function(evt) { evt.preventDefault(); scrollContainer.scrollLeft += evt.deltaY; });
        }
    </script>
