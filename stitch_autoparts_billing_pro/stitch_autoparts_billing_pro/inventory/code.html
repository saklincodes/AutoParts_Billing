ext-[18px]">settings_input_component</span> <span class="font-label-lg text-label-lg">Engine</span> </button> <button class="flex items-center gap-xs px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full shrink-0 transition-transform active:scale-95"> <span class="material-symbols-outlined text-[18px]">tire_repair</span> <span class="font-label-lg text-label-lg">Tires</span> </button> <button class="flex items-center gap-xs px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full shrink-0 transition-transform active:scale-95"> <span class="material-symbols-outlined text-[18px]">lightbulb</span> <span class="font-label-lg text-label-lg">Lighting</span> </button> </div> </div> <!-- Inventory Stats (Subtle Context) --> <div class="flex gap-md mb-2"> <div class="flex-1 bg-surface-container rounded-xl p-3 flex flex-col gap-1"> <span class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider">Total Items</span> <span class="text-on-surface font-headline-sm text-headline-sm">1,284</span> </div> <div class="flex-1 bg-tertiary-fixed rounded-xl p-3 flex flex-col gap-1"> <span class="text-on-tertiary-fixed-variant font-label-md text-label-md uppercase tracking-wider">Low Stock</span> <span class="text-on-tertiary-fixed font-headline-sm text-headline-sm">12 Items</span> </div> </div> <!-- Product List --> <div class="flex flex-col gap-md" id="productContainer"> </div> <!-- Floating Action Button --> <div class="fixed bottom-20 right-6 flex flex-col gap-3 z-40" id="fab-group"> <a class="w-14 h-14 bg-primary text-on-primary rounded-2xl shadow-xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all" href="/api/pages/add-product/"> <span class="material-symbols-outlined text-[28px]">add</span> </a> <a class="w-14 h-14 bg-secondary-container text-on-secondary-container rounded-2xl shadow-xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all" href="/api/pages/stock-adjustment/"> <span class="material-symbols-outlined text-[28px]">swap_vert</span> </a> </div> <script>
let allProducts = [];
let currentFilter = '';

async function loadProducts(filter) {
  filter = filter || '';
  try {
    allProducts = await AppDB.searchProducts();
    let filtered = allProducts;
    if (filter) {
      const fLower = filter.toLowerCase();
      filtered = allProducts.filter(function(p) {
        const catStr = (p.category_name || p.category || '').toString().toLowerCase();
        return catStr.includes(fLower);
      });
    }
    renderProducts(filtered);
    updateStats();
  } catch (e) {
    console.warn('AppDB error', e);
  }
}

async function updateStats() {
  try {
    var products = await AppDB.getProducts();
    var total = products.length;
    var lowStock = products.filter(function(p) {
      return Number(p.stock_qty || 0) <= Number(p.low_stock_qty || 5);
    }).length;
    var totalElem = document.querySelectorAll('.bg-surface-container .font-headline-sm')[0];
    var lowElem = document.querySelectorAll('.bg-tertiary-fixed .font-headline-sm')[0];
    if (totalElem) totalElem.textContent = total;
    if (lowElem) lowElem.textContent = lowStock + ' Items';
  } catch (e) {}
}

function renderProducts(products) {
  const container = document.getElementById('productContainer');
  if (!container) return;
  if (!products || products.length === 0) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center py-12 px-margin-mobile text-center gap-sm opacity-60">
        <span class="material-symbols-outlined text-[48px] text-outline">inventory_2</span>
        <p class="font-body-md text-body-md text-on-surface-variant">No products found.<br/>Click + to add a new product.</p>
      </div>
    `;
    return;
  }
  container.innerHTML = products.map(p => {
    const isLow = Number(p.stock_qty || 0) <= Number(p.low_stock_qty || 5);
    const safeName = (p.name || 'Unnamed Product').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    const priceFormatted = Number(p.price || 0).toLocaleString('en-IN');
    return `
      <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden group active:scale-[0.98] transition-transform">
        <div class="flex h-32">
          <div class="w-32 h-full relative shrink-0 bg-surface-container-highest flex items-center justify-center overflow-hidden">
            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover"/>` : '<span class="material-symbols-outlined text-[40px] text-outline">inventory_2</span>'}
            ${isLow ? '<div class="absolute top-2 left-2 px-2 py-1 bg-tertiary text-on-tertiary rounded font-label-md text-[10px] uppercase font-bold">Low Stock</div>' : ''}
          </div>
          <div class="flex-1 p-3 flex flex-col justify-between min-w-0">
            <div class="flex justify-between items-start">
              <div class="min-w-0">
                <h3 class="text-on-surface font-title-lg text-title-lg truncate">${p.name || 'Unnamed Product'}</h3>
                <p class="text-on-surface-variant font-body-md text-body-md line-clamp-1">${p.brand || p.category_name || ''} - SKU: ${p.sku || 'N/A'}</p>
              </div>
              <div class="flex gap-1">
                <button type="button" class="p-2 text-on-surface-variant hover:bg-surface-container rounded-lg cursor-pointer" onclick="event.stopPropagation(); editProduct(${p.id})">
                  <span class="material-symbols-outlined text-[20px]">edit</span>
                </button>
              </div>
            </div>
            <div class="flex items-end justify-between">
              <div class="flex flex-col">
                <span class="text-primary font-headline-sm text-headline-sm">₹${priceFormatted}</span>
                <span class="text-on-surface-variant font-label-md text-label-md">Qty: <span class="${isLow ? 'text-tertiary font-bold' : 'font-bold'}">${p.stock_qty || 0} units</span></span>
              </div>
              <button type="button" class="p-2 text-error hover:bg-error-container/20 rounded-lg cursor-pointer" onclick="event.stopPropagation(); deleteProduct(${p.id}, '${safeName}')">
                <span class="material-symbols-outlined text-[20px]">delete</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function editProduct(id) {
  if (window.location.pathname.includes('/api/pages/')) {
    window.location.href = '/api/pages/add-product/?id=' + id;
  } else {
    window.location.href = '../add_edit_product/code.html?id=' + id;
  }
}

function deleteProduct(id, name) {
  if (confirm('Delete "' + name + '"? This cannot be undone.')) {
    AppDB.deleteProduct(id).then(function() {
      loadProducts(currentFilter);
    }).catch(function(e) {
      alert('Delete failed: ' + (e ? e.message : 'Error'));
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadProducts();
  const searchInput = document.getElementById('productSearch');
  let searchTimer;
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const q = searchInput.value.toLowerCase();
        const filtered = allProducts.filter(p =>
          (p.name && p.name.toLowerCase().includes(q)) ||
          (p.sku && p.sku.toLowerCase().includes(q)) ||
          (p.brand && p.brand.toLowerCase().includes(q))
        );
        renderProducts(filtered);
      }, 200);
    });
  }

  const filters = document.querySelectorAll('button[class*="rounded-full"]');
  filters.forEach(btn => {
    btn.addEventListener('click', () => {
      filters.forEach(b => {
        b.classList.remove('bg-primary', 'text-on-primary');
        b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
      });
      btn.classList.add('bg-primary', 'text-on-primary');
      btn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
      const cat = btn.querySelector('span:last-child').textContent.trim();
      currentFilter = cat === 'All Categories' ? '' : cat;
      loadProducts(currentFilter);
    });
  });

  const fab = document.getElementById('fab-group');
  if (fab) {
    fab.animate([
      { transform: 'scale(1)', boxShadow: '0 10px 25px -5px rgba(0, 6, 102, 0.4)' },
      { transform: 'scale(1.1)', boxShadow: '0 15px 30px -5px rgba(0, 6, 102, 0.6)' },
      { transform: 'scale(1)', boxShadow: '0 10px 25px -5px rgba(0, 6, 102, 0.4)' }
    ], { duration: 1000, iterations: 2, easing: 'ease-in-out' });
  }
});
</script> </div><div id="bottom-nav-spacer" class="h-32 w-full shrink-0"></div></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="flex justify-between items-center h-16 px-2 max-w-lg mx-auto"><a class="flex flex-col items-center justify-center gap-1 w-1/5 text-on-surface-variant transition-colors" data-path="dashboard" href="/api/pages/dashboard/"><span class="material-symbols-outlined">dashboard</span><span class="text-[10px] font-label-md uppercase tracking-tighter">Dashboard</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/5 text-on-surface-variant transition-colors" data-path="billing" href="/api/pages/billing/"><span class="material-symbols-outlined">receipt_long</span><span class="text-[10px] font-label-md uppercase tracking-tighter">Billing</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-1/5 transition-colors text-primary font-bold" data-path="inventory" href="/api/pages/inventory/"><span class="material-symbols-outlined">inventory_2</span><span class="text-[10px] font-label-md uppercase tracking-tighter">Stock</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/5 text-on-surface-variant transition-colors" href="/api/pages/reports/"><span class="material-symbols-outlined">bar_chart</span><span class="text-[10px] font-label-md uppercase tracking-tighter">Reports</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/5 text-on-surface-variant transition-colors" href="/api/pages/settings/"><span class="material-symbols-outlined">settings</span><span class="text-[10px] font-label-md uppercase tracking-tighter">Settings</span></a></div></nav></body></html>
