  </head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 flex items-center justify-between px-margin-mobile"><div class="flex items-center gap-sm"><img alt="Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuvIrNaIfXRA6BPlb9HQ9Zgrih5ifjPd-wRDf17Xikfw6qTLCB85tbFDSdDy-WOmgH5C7VbWMnx1aiUsqmPB53QX56HdhK9oV599l0yytOgGCfFKyqiprCgLP0SU0508nJm-rWGyzjsiWpGpozfhwrbThNSkafPnUCnObbKQbSSOCjrL2-tQr7aBd4shqSJKG4Ny_0AbdRVlF3fTw2DppEZsHIgSWQAoazOi9ucG3ZLFd79FulL9fYzUQ"/><span class="font-title-lg text-title-lg text-primary truncate max-w-[180px]">Customers</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="pt-16 pb-24 min-h-screen bg-background"><div class="flex flex-col w-full px-margin-mobile gap-lg">

<span class="material-symbols-outlined text-[28px]">person_add</span>
</button>
</div>
<script>
  const API_BASE = '/api';
  let allCustomers = [];

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
  }

  function getAvatarBg(name) {
    const colors = ['bg-secondary-container', 'bg-primary-fixed', 'bg-secondary-fixed-dim', 'bg-primary-container', 'bg-tertiary-fixed'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  async function loadCustomers(search = '') {
    try {
      let url = API_BASE + '/customers/';
      if (search) url += '?search=' + encodeURIComponent(search);
      const res = await fetch(url);
      allCustomers = await res.json();
      renderCustomers(allCustomers);
      // Update count
      const countEl = document.querySelector('.bg-primary-container span');
      if (countEl) countEl.textContent = 'All (' + allCustomers.length + ')';
    } catch (e) {
      console.warn('API not reachable');
    }
  }

  function renderCustomers(customers) {
    const container = document.getElementById('customer-list');
    const emptyState = document.getElementById('empty-state');

    if (customers.length === 0) {
      container.innerHTML = '';
      container.classList.add('hidden');
      emptyState.classList.remove('hidden');
      return;
    }

    container.classList.remove('hidden');
    emptyState.classList.add('hidden');

    container.innerHTML = customers.map(c => {
      const initials = getInitials(c.name);
      const bg = getAvatarBg(c.name);
      return `
        <div class="bg-surface-container-lowest p-md rounded-xl shadow-sm flex items-center gap-md active:scale-[0.98] transition-transform cursor-pointer">
          <div class="w-12 h-12 rounded-full ${bg} flex items-center justify-center text-on-secondary-container shrink-0">
            <span class="font-headline-sm text-headline-sm">${initials}</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start">
              <h3 class="font-title-lg text-title-lg text-on-surface truncate">${c.name}</h3>
              ${c.is_premium ? '<span class="px-sm py-[2px] bg-tertiary-fixed text-on-tertiary-fixed rounded font-label-md text-label-md uppercase tracking-wider shrink-0">Premium</span>' : ''}
            </div>
            <p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
              <span class="material-symbols-outlined text-[16px]">smartphone</span>
              ${c.phone}
            </p>
            <div class="flex items-center gap-md mt-sm pt-sm border-t border-outline-variant/30">
              ${c.vehicle_no ? '<div class="flex items-center gap-xs text-primary"><span class="material-symbols-outlined text-[18px]">directions_car</span><span class="font-label-lg text-label-lg">' + c.vehicle_no + '</span></div>' : ''}
              <div class="flex items-center gap-xs text-outline">
                <span class="material-symbols-outlined text-[18px]">history</span>
                <span class="font-label-md text-label-md">${new Date(c.created_at).toLocaleDateString()}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadCustomers();

    const searchInput = document.getElementById('customerSearch');
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadCustomers(e.target.value.trim());
      }, 300);
    });

    // Add Customer FAB
    document.querySelectorAll('button').forEach(btn => {
      if (btn.querySelector('.material-symbols-outlined')?.textContent === 'person_add') {
        btn.addEventListener('click', () => {
          const name = prompt('Customer name:');
          if (!name) return;
          const phone = prompt('Phone number:') || '';
          const vehicle = prompt('Vehicle number:') || '';
          fetch(API_BASE + '/customers/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, vehicle_no: vehicle })
          }).then(r => r.json()).then(() => loadCustomers()).catch(() => alert('Error creating customer'));
        });
      }
    });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"><div class="flex justify-between items-center h-16 px-xs"><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" data-path="dashboard" href="/api/pages/dashboard/"><span class="material-symbols-outlined">dashboard</span><span class="font-label-md text-label-md">Dashboard</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" data-path="billing" href="/api/pages/billing/"><span class="material-symbols-outlined">receipt_long</span><span class="font-label-md text-label-md">Billing</span></a><a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-xs transition-colors text-primary font-semibold" data-path="customers" href="/api/pages/customers/"><span class="material-symbols-outlined">group</span><span class="font-label-md text-label-md">Customers</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" data-path="inventory" href="/api/pages/inventory/"><span class="material-symbols-outlined">inventory_2</span><span class="font-label-md text-label-md">Stock</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" href="/api/pages/reports/"><span class="material-symbols-outlined">analytics</span><span class="font-label-md text-label-md">Reports</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" href="/api/pages/settings/"><span class="material-symbols-outlined">settings</span><span class="font-label-md text-label-md">Settings</span></a></div></nav></body></html>
