face flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500" id="transition-overlay"> <div class="flex flex-col items-center"> <div class="w-20 h-20 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg"> <span class="material-symbols-outlined text-[48px]">check_circle</span> </div> </div> </div> </div> <script> (function() { // Initial entrance animations setTimeout(() => { const logoWrapper = document.getElementById('logo-wrapper'); if (logoWrapper) { logoWrapper.classList.remove('opacity-0', 'scale-90', 'translate-y-4'); logoWrapper.classList.add('opacity-100', 'scale-100', 'translate-y-0'); } const progressBar = document.getElementById('progress-bar'); if (progressBar) { progressBar.style.width = '100%'; } }, 100); // Transition logic setTimeout(() => { const overlay = document.getElementById('transition-overlay'); if (overlay) { overlay.classList.remove('opacity-0', 'pointer-events-none'); overlay.classList.add('opacity-100'); // Final hand-off after overlay covers screen setTimeout(() => { // This would ideally navigate to the stock/lock selection screen console.log('Transition to Stock Selection Triggered'); // For demo purposes, we will just show a simple notification or mock UI state overlay.innerHTML = ` <div class="flex flex-col items-center gap-lg px-margin-mobile"> <span class="material-symbols-outlined text-primary text-[64px] animate-bounce">inventory_2</span> <h2 class="font-headline-sm text-headline-sm text-on-surface">Secure Lock Selected</h2> <p class="font-body-md text-body-md text-secondary">Entering Dashboard...</p> </div> `; }, 500); } }, 3200); // Haptic feedback simulation for tech-heavy feel const triggers = ['20%', '50%', '80%', '100%']; triggers.forEach((percent, index) => { setTimeout(() => { if (window.navigator && window.navigator.vibrate) { window.navigator.vibrate(5); } }, 700 * (index + 1)); }); })(); </script> <style> @keyframes shimmer { 0% {
