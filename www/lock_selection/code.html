  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><main  class="flex-1 relative w-full" style="padding-top: calc(4.75rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));"><div class="flex flex-col w-full">
<!-- Visual Accent: Floating Shapes -->
<div class="relative w-full h-48 flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 flex items-center justify-center">
<svg class="w-full h-full opacity-20" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path d="M44.7,-76.4C58.1,-69.2,69.2,-57.1,76.5,-43.5C83.8,-29.8,87.3,-14.9,86.2,-0.6C85.1,13.7,79.5,27.3,71.2,39.5C62.9,51.7,51.9,62.4,39,70.5C26.1,78.5,13,83.9,-0.8,85.3C-14.7,86.7,-29.4,84,-42.6,76.2C-55.8,68.4,-67.5,55.5,-75.4,41C-83.3,26.5,-87.3,10.4,-85.1,-4.9C-82.9,-20.1,-74.5,-34.5,-63.9,-46.3C-53.3,-58.1,-40.5,-67.4,-27,-74.5C-13.5,-81.6,0.1,-86.5,14,-85.4C27.9,-84.3,44.7,-76.4Z" fill="#4C56AF" transform="translate(100 100)">
<animatetransform attributename="transform" dur="20s" from="0 100 100" repeatcount="indefinite" to="360 100 100" type="rotate"></animatetransform>
</path>
</svg>
</div>
<div class="relative z-10 text-center px-margin-mobile">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-md shadow-md">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 32px;">shield_lock</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Secure Your App</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">Choose how you want to unlock your workspace. You can change this later in settings.</p>
</div>
</div>
<!-- Options Container -->
<div class="px-margin-mobile pb-xl space-y-md">
<!-- Fingerprint Lock Card -->
<button class="w-full text-left group transition-all duration-200 focus:outline-none" onclick="selectOption(this)">
<div class="bg-surface-container-low p-lg rounded-xl flex items-center gap-lg shadow-sm group-active:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center flex-shrink-0 group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary" style="font-size: 28px;">fingerprint</span>
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface">Fingerprint Lock</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Fast and secure biometric entry</p>
</div>
<span class="material-symbols-outlined text-outline transition-transform group-hover:translate-x-1">chevron_right</span>
</div>
</button>
<!-- PIN Lock Card -->
<button class="w-full text-left group transition-all duration-200 focus:outline-none" onclick="selectOption(this)">
<div class="bg-surface-container-low p-lg rounded-xl flex items-center gap-lg shadow-sm group-active:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-lg bg-secondary/10 flex items-center justify-center flex-shrink-0 group-hover:bg-secondary/20 transition-colors">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">pin</span>
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface">PIN Lock</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Enter a 6-digit secure code</p>
</div>
<span class="material-symbols-outlined text-outline transition-transform group-hover:translate-x-1">chevron_right</span>
</div>
</button>
<!-- No Lock Card -->
<button class="w-full text-left group transition-all duration-200 focus:outline-none" onclick="selectOption(this)">
<div class="bg-surface-container-low p-lg rounded-xl flex items-center gap-lg shadow-sm group-active:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center flex-shrink-0 group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 28px;">lock_open</span>
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface">No Lock</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Immediate access (not recommended)</p>
</div>
<span class="material-symbols-outlined text-outline transition-transform group-hover:translate-x-1">chevron_right</span>
</div>
</button>
</div>
<!-- Helpful Tip Section -->
<div class="mt-auto px-margin-mobile pb-safe">
<div class="bg-secondary-container p-md rounded-lg flex items-start gap-md">
<span class="material-symbols-outlined text-on-secondary-container mt-xs">info</span>
<p class="font-label-md text-label-md text-on-secondary-container leading-relaxed">
                Biometric data stays on your device. We never store your fingerprints or PIN on our servers.
            </p>
</div>
</div>
<script>
        function selectOption(element) {
            // Visual feedback for selection
            const allCards = document.querySelectorAll('.bg-surface-container-low');
            allCards.forEach(card => {
                card.classList.remove('bg-primary-container', 'shadow-md');
                card.classList.add('bg-surface-container-low');
                const textNodes = card.querySelectorAll('h3, p');
                textNodes[0].classList.replace('text-on-primary-container', 'text-on-surface');
                textNodes[1].classList.replace('text-on-primary-container/80', 'text-on-surface-variant');
            });

            const card = element.querySelector('.bg-surface-container-low');
            card.classList.remove('bg-surface-container-low');
            card.classList.add('bg-primary-container', 'shadow-md');
            
            const textNodes = card.querySelectorAll('h3, p');
            textNodes[0].classList.replace('text-on-surface', 'text-on-primary-container');
            textNodes[1].classList.replace('text-on-surface-variant', 'text-on-primary-container/80');

            // Haptic-like effect and delayed navigation logic would go here
            setTimeout(() => {
                console.log('Option Selected: ' + textNodes[0].innerText);
            }, 300);
        }
    </script>
</div></main></body></html>
