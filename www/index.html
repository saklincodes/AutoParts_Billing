<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;height:100%;}body{overscroll-behavior:none;}main{overflow-y:auto;-webkit-overflow-scrolling:touch;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}.shimmer-text{background:linear-gradient(90deg,#454652 25%,#1a237e 50%,#454652 75%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s infinite linear}</style><link href="css/tailwind.css" rel="stylesheet"><script src="./js/app-db.js"></script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 relative w-full"><div class="flex flex-col w-full overflow-hidden" id="splash-screen-container">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<svg class="w-full h-full opacity-30" preserveaspectratio="xMidYMid slice" viewbox="0 0 100 100">
<defs>
<radialgradient cx="50%" cy="50%" fx="50%" fy="50%" id="grad1" r="50%">
<stop offset="0%" style="stop-color:var(--primary-fixed);stop-opacity:0.4"></stop>
<stop offset="100%" style="stop-color:transparent;stop-opacity:0"></stop>
</radialgradient>
</defs>
<circle cx="20" cy="20" fill="url(#grad1)" r="40">
<animatetransform attributename="transform" dur="10s" from="-10 -10" repeatcount="indefinite" to="10 10" type="translate"></animatetransform>
</circle>
<circle cx="80" cy="80" fill="url(#grad1)" r="30">
<animatetransform attributename="transform" dur="8s" from="10 10" repeatcount="indefinite" to="-10 -10" type="translate"></animatetransform>
</circle>
</svg>
</div>
<div class="relative z-10 flex flex-col items-center justify-center min-h-[80vh] px-margin-mobile text-center">
<div class="opacity-0 scale-90 translate-y-4 transition-all duration-1000 ease-out" id="logo-wrapper">
<div class="relative w-32 h-32 mb-lg mx-auto">
<div class="absolute inset-0 rounded-full bg-primary/10 animate-ping"></div>
<svg class="relative w-full h-full drop-shadow-xl" viewbox="0 0 128 128"><circle cx="64" cy="64" r="60" fill="currentColor" class="text-primary"/><text x="64" y="82" text-anchor="middle" fill="currentColor" class="text-surface" font-size="44" font-weight="800" font-family="sans-serif">PA</text></svg>
</div>
<div class="space-y-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight uppercase">
          Putul Auto Parts
        </h1>
<div class="flex items-center justify-center gap-sm">
<div class="h-[1px] w-8 bg-outline-variant"></div>
<span class="font-label-lg text-label-lg text-secondary tracking-widest uppercase">
            &amp; Autoscan
          </span>
<div class="h-[1px] w-8 bg-outline-variant"></div>
</div>
</div>
</div>
<div class="absolute bottom-16 left-0 right-0 px-xl flex flex-col items-center gap-md">
<div class="w-full max-w-[200px] h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-0 transition-all duration-[3000ms] ease-in-out" id="progress-bar"></div>
</div>
<p class="font-label-md text-label-md text-on-surface-variant/60 animate-pulse" id="loading-text">
        Initializing POS Environment...
      </p>
</div>
</div>
<div class="fixed inset-0 z-50 bg-surface flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500" id="transition-overlay">
<div class="flex flex-col items-center">
<div class="w-20 h-20 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg">
<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</div>
</div>
</div>
<script>
  (function() {
    var initDone = false;
    var navStarted = false;

    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.SplashScreen) {
      Capacitor.Plugins.SplashScreen.hide();
    }

    AppDB.init().then(function() {
      initDone = true;
    }).catch(function() {
      initDone = true;
    });

    function navigateToDashboard() {
      if (navStarted) return;
      localStorage.removeItem('_nav');
      navStarted = true;
      var overlay = document.getElementById('transition-overlay');
      if (overlay) {
        document.getElementById('loading-text').textContent = 'Ready!';
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100');
        setTimeout(function() {
          window.location.replace('dashboard/code.html');
        }, 600);
      } else {
        window.location.replace('dashboard/code.html');
      }
    }

    setTimeout(function() {
      var logoWrapper = document.getElementById('logo-wrapper');
      if (logoWrapper) {
        logoWrapper.classList.remove('opacity-0', 'scale-90', 'translate-y-4');
        logoWrapper.classList.add('opacity-100', 'scale-100', 'translate-y-0');
      }
      var progressBar = document.getElementById('progress-bar');
      if (progressBar) {
        progressBar.style.width = '100%';
      }
    }, 100);

    setTimeout(function() {
      if (initDone) {
        navigateToDashboard();
      } else {
        document.getElementById('loading-text').textContent = 'Almost there...';
        var checkInterval = setInterval(function() {
          if (initDone) {
            clearInterval(checkInterval);
            navigateToDashboard();
          }
        }, 100);
      }
    }, 2800);

    setTimeout(function() {
      navigateToDashboard();
    }, 5000);
  })();
</script></main></body></html>
