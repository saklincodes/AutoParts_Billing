<style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .success-pop { animation: success-pop 0.3s ease-out forwards; }
    @keyframes success-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
<script>
    let currentPin = '';
    const MAX_PIN_LENGTH = 4;
    const dots = document.getElementById('pin-dots').children;
    const message = document.getElementById('pin-message');

    function updateDots() {
      for (let i = 0; i < dots.length; i++) {
        if (i < currentPin.length) {
          dots[i].classList.remove('bg-surface-container-highest');
          dots[i].classList.add('bg-primary', 'scale-125');
        } else {
          dots[i].classList.add('bg-surface-container-highest');
          dots[i].classList.remove('bg-primary', 'scale-125');
        }
      }
    }

    function pressKey(num) {
      if (currentPin.length < MAX_PIN_LENGTH) {
        currentPin += num;
        updateDots();
        
        if (currentPin.length === MAX_PIN_LENGTH) {
          handlePinSubmit();
        }
      }
    }

    function backspace() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updateDots();
      }
    }

    function handlePinSubmit() {
      // Mock validation logic
      const isCorrect = currentPin === '1234'; // Sample Correct PIN
      
      setTimeout(() => {
        if (isCorrect) {
          message.innerText = 'Access Granted';
          message.classList.replace('text-on-surface-variant', 'text-primary');
          document.getElementById('pin-dots').classList.add('success-pop');
          // In a real app: window.location.href = '/dashboard';
        } else {
          message.innerText = 'Incorrect PIN. Try again.';
          message.classList.replace('text-on-surface-variant', 'text-error');
          document.getElementById('pin-dots').classList.add('shake');
          
          setTimeout(() => {
            currentPin = '';
            updateDots();
            document.getElementById('pin-dots').classList.remove('shake');
            message.innerText = 'Enter Security PIN';
            message.classList.replace('text-error', 'text-on-surface-variant');
          }, 800);
        }
      }, 200);
    }

    // Add haptic feedback simulation
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('touchstart', () => {
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(10);
        }
      });
    });
  </script>
