<circle class="text-outline" cx="85" cy="90" fill="currentColor" r="4"></circle>
<circle class="text-outline" cx="115" cy="90" fill="currentColor" r="4"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-outline/20 text-[120px]">person_off</span>

</div>
<h4 class="font-headline-sm text-headline-sm text-on-surface mb-sm">Quiet in the shop?</h4>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">We couldn't find any customers matching your search. Try a different name or add a new profile.</p>
<button class="px-lg py-md bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center gap-sm shadow-md">
<span class="material-symbols-outlined">person_add</span>
      Add New Customer
    </button>
</div>
<!-- Floating Action Button -->
<button class="fixed bottom-24 right-margin-mobile w-14 h-14 bg-primary text-on-primary rounded-xl shadow-xl flex items-center justify-center active:scale-95 transition-transform z-10">
<span class="material-symbols-outlined text-[28px]">person_add</span>
</button>
</div>
<script>
  let allCustomers = [];

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
  }

  function getAvatarBg(name) {
    const colors = ['bg-secondary-container', 'bg-primary-fixed', 'bg-secondary-fixed-dim', 'bg-primary-container', 'bg-tertiary-fixed'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  async function loadCustomers(search) {
    search = search || '';
    try {
      allCustomers = await AppDB.searchCustomers(search);
      renderCustomers(allCustomers);
      var countEl = document.querySelector('.bg-primary-container span');
      if (countEl) countEl.textContent = 'All (' + allCustomers.length + ')';
    } catch (e) { console.warn('AppDB error', e); }
  }

  function renderCustomers(customers) {
    const container = document.getElementById('customer-list');
    const emptyState = document.getElementById('empty-state');

    if (customers.length === 0) {
      container.innerHTML = '';
      container.classList.add('hidden');
      emptyState.classList.remove('hidden');
      return;
    }

    container.classList.remove('hidden');
    emptyState.classList.add('hidden');

    container.innerHTML = customers.map(c => {
      const initials = getInitials(c.name);
      const bg = getAvatarBg(c.name);
      return `
        <div class="bg-surface-container-lowest p-md rounded-xl shadow-sm flex items-center gap-md active:scale-[0.98] transition-transform cursor-pointer">
          <div class="w-12 h-12 rounded-full ${bg} flex items-center justify-center text-on-secondary-container shrink-0">
            <span class="font-headline-sm text-headline-sm">${initials}</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start">
              <h3 class="font-title-lg text-title-lg text-on-surface truncate">${c.name}</h3>
              ${c.is_premium ? '<span class="px-sm py-[2px] bg-tertiary-fixed text-on-tertiary-fixed rounded font-label-md text-label-md uppercase tracking-wider shrink-0">Premium</span>' : ''}
            </div>
            <p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
              <span class="material-symbols-outlined text-[16px]">smartphone</span>
              ${c.phone}
            </p>
            <div class="flex items-center gap-md mt-sm pt-sm border-t border-outline-variant/30">
              ${c.vehicle_no ? '<div class="flex items-center gap-xs text-primary"><span class="material-symbols-outlined text-[18px]">directions_car</span><span class="font-label-lg text-label-lg">' + c.vehicle_no + '</span></div>' : ''}
              <div class="flex items-center gap-xs text-outline">
                <span class="material-symbols-outlined text-[18px]">history</span>
                <span class="font-label-md text-label-md">${new Date(c.created_at).toLocaleDateString()}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadCustomers();

    const searchInput = document.getElementById('customerSearch');
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadCustomers(e.target.value.trim());
      }, 300);
    });

    // Add Customer FAB
    document.querySelectorAll('button').forEach(function(btn) {
      if (btn.querySelector('.material-symbols-outlined') && btn.querySelector('.material-symbols-outlined').textContent === 'person_add') {
        btn.addEventListener('click', function() {
          var name = prompt('Customer name:');
          if (!name) return;
          var phone = prompt('Phone number:') || '';
          var vehicle = prompt('Vehicle number:') || '';
          AppDB.saveCustomer({ name: name, phone: phone, vehicle_no: vehicle, total_visits: 0, total_spent: 0 }).then(function() {
            loadCustomers();
          }).catch(function() { alert('Error creating customer'); });
        });
      }
    });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"><div class="flex justify-between items-center h-16 px-xs"><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" data-path="dashboard" href="../dashboard/code.html"><span class="material-symbols-outlined">dashboard</span><span class="font-label-md text-label-md">Dashboard</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" data-path="billing" href="../new_billing_1/code.html"><span class="material-symbols-outlined">receipt_long</span><span class="font-label-md text-label-md">Billing</span></a><a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-xs transition-colors text-primary font-semibold" data-path="customers" href="#"><span class="material-symbols-outlined">group</span><span class="font-label-md text-label-md">Customers</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" data-path="inventory" href="../inventory/code.html"><span class="material-symbols-outlined">inventory_2</span><span class="font-label-md text-label-md">Stock</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" href="../reports/code.html"><span class="material-symbols-outlined">analytics</span><span class="font-label-md text-label-md">Reports</span></a><a class="flex-1 flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors" href="../settings/code.html"><span class="material-symbols-outlined">settings</span><span class="font-label-md text-label-md">Settings</span></a></div></nav></body></html>
